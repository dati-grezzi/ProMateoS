<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15132B">
<title>ProMateoS · programmazione didattica</title>
<link rel="icon" type="image/svg+xml" href="logo/favicon.svg">
<link rel="apple-touch-icon" href="logo/icona-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
@font-face{font-family:'Zilla Slab';font-weight:700;font-style:normal;font-display:swap;src:url('caratteri/ZillaSlab-Bold.woff2') format('woff2')}
:root{--ink:#15132B;--ink2:#2A2658;--viola:#6A4CFF;--viola-ch:#EEEAFF;--cyan:#1FD1E8;--menta:#17B890;--ambra:#B7791F;--ambra-bg:#FFF4DC;--rosso:#D63A40;--rosso-bg:#FFE9EA;--bg:#F4F5FD;--card:#fff;--line:#E2E3F3;--muted:#6B6A8A}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;line-height:1.45}
h1,h2,h3,h4{font-family:'Zilla Slab',Georgia,serif;font-weight:700;margin:0}
h2{font-size:1.15rem}h3{font-size:1.05rem}h4{font-size:.9rem;margin:14px 0 6px;color:var(--ink2)}
p{margin:6px 0}
.testata{background:#1B1450;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.marchio{display:flex;align-items:center}
.marchio svg{height:42px;width:auto;display:block}
.icona-grande svg{width:88px;height:88px;display:block;margin:0 auto}
.anno-badge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 10px;border-radius:999px;font-size:.8rem;white-space:nowrap}
nav.schede{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.schede button{flex:1;border:0;background:none;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:.7rem;color:var(--muted);cursor:pointer}
nav.schede button.on{color:var(--viola);font-weight:600}
.ico{width:22px;height:22px}
main{max-width:860px;margin:0 auto;padding:14px 14px 96px}
.stack{display:flex;flex-direction:column;gap:14px}
@media(min-width:760px){
  nav.schede{position:static;max-width:860px;margin:12px auto 0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  nav.schede button{flex-direction:row;justify-content:center;gap:8px;padding:12px;font-size:.9rem}
  main{padding-bottom:40px}
}
.pannello{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(21,19,43,.04)}
.pannello-testa{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.azioni{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pannello-testa .azioni{margin-top:0}
.bt{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;font-size:.92rem;background:var(--viola);color:#fff;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.bt:hover{background:#5A3CF0}
.bt:disabled{opacity:.45;cursor:not-allowed}
.bt.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.bt.ghost:hover{background:var(--viola-ch)}
.bt.piccolo{padding:6px 12px;min-height:36px;font-size:.84rem;border-radius:10px}
.bt.pericolo{color:var(--rosso)}
.bt.file{cursor:pointer}
input,select,textarea{font:inherit;font-size:1rem;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--viola);outline-offset:-1px;border-color:transparent}
input[type=checkbox]{width:20px;height:20px;padding:0;flex:none}
textarea{resize:vertical}
.campo{display:flex;flex-direction:column;gap:4px}
.campo-et{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.aiuto{font-size:.78rem;color:var(--muted)}
.griglia{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.griglia.aggiungi{align-items:end;margin-top:12px}
.spunta{display:flex;gap:10px;align-items:center;margin-top:10px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:.88rem;cursor:pointer;color:var(--ink2);min-height:38px}
.chip.piccolo{padding:5px 11px;font-size:.8rem;min-height:32px}
.chip.on{background:var(--viola);border-color:var(--viola);color:#fff}
.elenco,.lista,.lista-scelta,.ordine{list-style:none;margin:0;padding:0}
.lista{list-style:disc;padding-left:20px;font-size:.88rem}
.riga{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.elenco>li:last-child>.riga:last-child{border-bottom:0}
.riga-testo{display:flex;flex-direction:column;min-width:0}
.sotto{font-size:.8rem;color:var(--muted)}
.blocco{padding:6px 0}
.dettaglio{padding:4px 0 10px}
details.sezione{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:#FBFBFF}
details summary{cursor:pointer}
.tag{display:inline-block;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px;background:#EDEEF8;color:var(--ink2);white-space:nowrap}
.tag.viola{background:var(--viola-ch);color:var(--viola)}
.tag.verde{background:#DDF7EE;color:#0B7D61}
.tag.rosso{background:var(--rosso-bg);color:var(--rosso)}
.vuoto{color:var(--muted);font-size:.9rem}
.errore{color:var(--rosso);background:var(--rosso-bg);padding:8px 12px;border-radius:10px;font-size:.9rem}
.avviso{color:var(--ambra);background:var(--ambra-bg);padding:8px 12px;border-radius:10px;font-size:.88rem}
.ok{color:#0B7D61;background:#DDF7EE;padding:8px 12px;border-radius:10px;font-size:.9rem}
.numeri{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0 12px}
.numeri div{background:var(--viola-ch);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.numeri b{font-family:'Zilla Slab',Georgia,serif;font-size:1.4rem;color:var(--ink2)}
.numeri span{font-size:.78rem;color:var(--muted)}
.benvenuto{text-align:center;background:linear-gradient(160deg,#fff 0%,#EEEAFF 100%);border:1px solid var(--line);border-radius:20px;padding:22px 18px}
.benvenuto h2{margin:8px 0 4px;font-size:1.4rem}
.benvenuto p{color:var(--muted);max-width:520px;margin:6px auto 14px}
.orario{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-bottom:12px}
.ora{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted)}
.segmenti{display:flex;gap:6px;background:#EDEEF8;border-radius:12px;padding:4px;margin-bottom:12px}
.segmenti button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:inherit;font-weight:600;color:var(--ink2);cursor:pointer}
.segmenti button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mese h3{position:sticky;top:0;background:var(--bg);padding:8px 2px;z-index:5;color:var(--ink2)}
.mese{display:flex;flex-direction:column;gap:8px}
.settimana{background:#fff;border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:14px;overflow:hidden}
.settimana.vacanza{border-left-color:#C9CBE0;background:#F8F8FC}
.settimana.sfora{border-left-color:var(--rosso)}
.settimana header{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;cursor:pointer;align-items:flex-start}
.settimana .feste{font-size:.78rem;color:var(--ambra)}
.riassunto{font-size:.84rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.settimana .corpo{padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.item{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:8px}
.item select{flex:0 0 108px;width:auto}
.item .testo{flex:1 1 180px;width:auto}
.item .ore-in{flex:0 0 70px;width:70px}
.item.tipo-verifica .testo{border-color:var(--rosso)}
.velo{position:fixed;inset:0;background:rgba(21,19,43,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.finestra{background:#fff;width:min(680px,100%);max-height:90vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0}
@media(min-width:760px){.velo{align-items:center}.finestra{border-radius:20px}}
.finestra-testa{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.finestra-corpo{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.finestra-piede{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.lista-scelta li{padding:3px 0}
.lista-scelta .spunta{margin-top:4px}
.scorri{overflow-x:auto}
.tabella{border-collapse:collapse;width:100%;font-size:.84rem;min-width:520px}
.tabella th,.tabella td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.tabella th{background:var(--viola-ch)}
.tabella tr.vac td{background:#F5F5FA;color:var(--muted)}
.mese-col{font-weight:600;white-space:nowrap}
.sett-col span{display:block;font-size:.72rem;color:var(--muted)}
.ore-col{text-align:center;white-space:nowrap}
.lista-compatta{list-style:none;padding:0;margin:8px 0;max-height:220px;overflow:auto;font-size:.88rem}
.lista-compatta li{padding:4px 0;border-bottom:1px solid var(--line)}
.revisione{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.tabella.anteprima th{padding:4px}
.tabella.anteprima select{font-size:.78rem;padding:5px;min-width:140px}
.tabella.anteprima td{font-size:.76rem;min-width:140px;max-width:220px}
.solo-stampa{display:none}
code{background:#EDEEF8;padding:1px 6px;border-radius:6px;font-size:.85em}
@media print{
  @page{size:landscape;margin:10mm}
  body{background:#fff}
  .testata,nav.schede,main .stack>*:not(.solo-stampa){display:none!important}
  main{padding:0;max-width:none}
  .solo-stampa{display:block!important}
  .solo-stampa h1{font-size:14pt;margin-bottom:8px}
  .tabella{min-width:0;font-size:9pt}
}
</style>
</head>

</html>
